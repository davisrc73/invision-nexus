<!doctype html>
<html lang="pt" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="pt,fr,en" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: http: https:; media-src 'self' blob: http: https:; connect-src 'self' ws: wss: http: https:; font-src 'self' data:;"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Invision Nexus Edge Player</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #boot-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
        color: #e1a924;
        text-align: center;
        padding: 2rem;
      }
      #boot-fallback h1 {
        font-size: 1.8rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        margin-bottom: 0.5rem;
        color: #ffffff;
      }
      #boot-fallback p {
        font-family: monospace;
        font-size: 0.9rem;
        color: #94a3b8;
      }
      .boot-spinner {
        margin-top: 1.5rem;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(225, 169, 36, 0.2);
        border-top-color: #e1a924;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body translate="no" class="notranslate" oncontextmenu="return false;">
    <div id="app">
      <!-- Ecrã inicial institucional visível enquanto o Svelte compila na TV -->
      <div id="boot-fallback">
        <h1>INVISION NEXUS</h1>
        <p id="boot-status">Inicialização do Ecrã Protegido • Modo Kiosk</p>
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script>
      // Kiosk Hardening: Bloqueio de menus de contexto e atalhos de depuração em loja
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
      document.addEventListener('keydown', function (e) {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
          (e.ctrlKey && e.key === 'u')
        ) {
          e.preventDefault();
        }
      });
      // Registo de erros silencioso em console (sem poluir a TV de loja com traces visíveis)
      window.onerror = function (msg, url, line) {
        console.error('[Kiosk Error]', msg, url, line);
      };
      window.onunhandledrejection = function (ev) {
        console.error('[Kiosk Promise Rejection]', ev.reason);
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

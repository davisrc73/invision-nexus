server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    # Desativa cache agressiva para index.html e sw.js para que as Boxes Android recebam sempre as novas versões
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}


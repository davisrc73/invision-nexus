# Docker Compose Completo - Invision Nexus (Fnac & Darty)
# Inclui os 5 serviços prontos para o Synology DS220+ (Dev/Staging) e Servidor Enterprise (Produção):
# 1. PostgreSQL 16 (Particionado por mês para 4.000 dispositivos / 1 ano de retenção)
# 2. Redis 7 (Heartbeats 60s, Supressão Noturna Expo e Pub/Sub)
# 3. Backend API & Sync Engine (Node.js 22 + Fastify + FFprobe Format Guardrail + WebSocket NTP)
# 4. Dashboard Central de Governance (Astro + Tailwind CSS)
# 5. Edge Player PWA Offline-First (Svelte + Dual-Buffer + 64GB ROM Cache + Millisecond Sync)

services:
  postgres:
    image: postgres:16-alpine
    container_name: invision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invision_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invision_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-invision_nexus}
      TZ: Europe/Lisbon
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "max_connections=150"
      - "-c"
      - "synchronous_commit=off"
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/sql/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invision_admin} -d ${POSTGRES_DB:-invision_nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: invision_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly no
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invision_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-invision_admin}:${POSTGRES_PASSWORD:-invision_secret_2026}@postgres:5432/${POSTGRES_DB:-invision_nexus}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-fnac_darty_invision_super_secret_jwt_key_change_in_prod}
      MEDIA_STORAGE_PATH: /app/data/storage/media
      STATE_FILE_PATH: /app/data/storage/live_state.json
      THUMBS_STORAGE_PATH: /app/data/storage/thumbs
      HEARTBEAT_INTERVAL_SEC: 60
      HEARTBEAT_TIMEOUT_SEC: 180
      STAGGER_WINDOW_MAX_SEC: 900
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./data/storage:/app/data/storage
    deploy:
      resources:
        limits:
          memory: 384M

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: invision_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${DASHBOARD_PORT:-4322}:80"
    deploy:
      resources:
        limits:
          memory: 128M

  player:
    build:
      context: ./player
      dockerfile: Dockerfile
    container_name: invision_player
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PLAYER_PORT:-5174}:80"
    deploy:
      resources:
        limits:
          memory: 128M

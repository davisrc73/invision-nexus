server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CRÍTICO PARA DOCKER NO SYNOLOGY NAS (ex: 4322:80):
    # Impede o Nginx de redirecionar para a porta 80 (removendo :4322) ao navegar para subpastas (/playlists, /store-wall, /telemetry)
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }
}
